# CD do backend na Oracle Cloud (VM Ampere A1, São Paulo) — E8-01.
#
# Convive com o cd-backend.yml (Render) durante a transição: publica a imagem
# numa tag própria (`<env>-arm64`) para não sobrescrever a imagem x86 que o
# Render ainda consome. O gatilho é manual de propósito; só passa a `push`
# quando a virada estiver validada e o Render for aposentado.
name: CD - Backend (Oracle Cloud)

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente de destino
        type: choice
        options: [dev, hom, prod]
        default: dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gabrielvogado/saude-monitor-backend

jobs:
  build:
    name: Build da imagem arm64 (${{ inputs.ambiente }})
    # Runner ARM nativo, gratuito em repositório público. Evita a emulação por
    # QEMU, que multiplica por 3 a 5 o tempo de um build Gradle.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.ambiente }}-arm64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64

  deploy:
    name: Deploy na VM (${{ inputs.ambiente }})
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enviar compose e Caddyfile para a VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: deploy/oracle/docker-compose.yml,deploy/oracle/Caddyfile
          target: /opt/saude-monitor
          strip_components: 2

      - name: Subir a nova imagem
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/saude-monitor
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            # O start_period do healthcheck é de 90 s; esperamos um pouco mais
            # antes de declarar o deploy bom.
            for i in $(seq 1 20); do
              estado=$(docker inspect -f '{{.State.Health.Status}}' saude-monitor-backend 2>/dev/null || echo indisponivel)
              echo "tentativa $i: $estado"
              [ "$estado" = "healthy" ] && exit 0
              sleep 10
            done
            echo "backend não ficou saudável; últimas linhas do log:"
            docker compose logs --tail 50 backend
            exit 1

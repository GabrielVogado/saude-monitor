name: CD - Backend (Render)

# PAUSADO em 04/09/2026 -- a publicacao do backend migrou para o Google Cloud
# Run (`cd-backend-google.yml`). O gatilho `push` foi removido de proposito: com
# ele, todo push em `backend/**` continuaria construindo e publicando no Render,
# competindo com o Cloud Run pelo mesmo backend e mantendo viva uma instancia
# `plan: free` que ninguem consome.
#
# O workflow NAO foi apagado: enquanto o Cloud Run nao estiver validado, o Render
# e o caminho de rollback. Continua acionavel sob demanda por `workflow_dispatch`.
# Para religar o automatico, restaurar o bloco `push:` abaixo.
on:
  # push:
  #   branches: [develop, master, 'release/**']
  #   paths:
  #     - 'backend/**'
  #     - '.github/workflows/cd-backend-render.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gabrielvogado/saude-monitor-backend
jobs:
  # Mapeia a branch para o ambiente de destino.
  #   develop       -> dev  (desenvolvimento)
  #   master        -> prod (produção contínua, imagem `:prod`)
  #   release/<tag> -> prod (produção, imagem `:<tag>`)
  #
  # ⚠️ BLOQUEIO CONHECIDO, a resolver quando o ambiente de produção for criado
  # (pendência P-006). Os dois destinos acima usam o MESMO `RENDER_SERVICE_ID_PROD`,
  # mas publicam tags de imagem diferentes -- e o POST em /v1/services/<id>/deploys
  # manda `{}`, ou seja, redeploya a imagem em que o serviço está fixado, e não a que
  # acabou de ser construída. Consequência: um push em `release/1.0.0` constrói a
  # `:1.0.0`, dispara o deploy, e o serviço sobe a `:prod` -- a "versão fixada" que os
  # documentos prometem seria construída e nunca implantada.
  #
  # Não foi corrigido aqui de propósito. As duas saídas são passar `imageUrl` no corpo
  # do POST ou usar service IDs separados, e ambas mudam o único caminho de deploy que
  # hoje funciona (o de `dev`) sem que este PR possa exercitá-lo: o `paths: backend/**`
  # impede o CD de rodar num PR que não toca o backend. Corrigir às cegas o caminho que
  # funciona, para consertar um que ainda não existe, é o negócio errado.
  #
  # O degrau de homologação saiu do mapeamento porque não existe: não há branch nem
  # ambiente. Quando o ambiente de homologação for criado, ele volta com a branch
  # correspondente.
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/heads/release/}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "tag=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    name: Build e deploy (${{ needs.resolve-env.outputs.env }})
    needs: resolve-env
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # PRIMEIRO passo de proposito. Antes vinha depois do build: a promocao gastava
      # a compilacao inteira para so entao falhar, e deixava no GHCR uma imagem
      # `:prod` que nunca foi implantada nem validada -- que seria a primeira coisa
      # que o servico de producao pegaria quando fosse criado.
      #
      # Uma promocao para producao que nao entrega e o pior caso do falso-verde: o
      # commit fica na branch de producao, o job fica verde e nada foi publicado.
      # Por isso este passo FALHA, em vez de pular com aviso -- ao contrario do caso
      # de um ambiente opcional, aqui a ausencia da credencial e um bloqueio real.
      - name: Verificar credenciais do ambiente (${{ needs.resolve-env.outputs.env }})
        env:
          RENDER_API_KEY: ${{ secrets[format('RENDER_API_KEY_{0}', needs.resolve-env.outputs.env)] }}
          RENDER_SERVICE_ID: ${{ secrets[format('RENDER_SERVICE_ID_{0}', needs.resolve-env.outputs.env)] }}
          AMBIENTE: ${{ needs.resolve-env.outputs.env }}
        run: |
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            AMB_MAIUSCULO=$(echo "$AMBIENTE" | tr '[:lower:]' '[:upper:]')
            echo "ERRO: o ambiente '$AMBIENTE' nao tem credenciais configuradas."
            echo "Defina os secrets RENDER_API_KEY_${AMB_MAIUSCULO} e RENDER_SERVICE_ID_${AMB_MAIUSCULO}"
            echo "em Settings > Secrets and variables > Actions, e crie o Web Service correspondente no Render."
            echo "Hoje so o ambiente 'dev' esta configurado."
            exit 1
          fi
          echo "credenciais presentes para $AMBIENTE"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve-env.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Disparar deploy no Render (${{ needs.resolve-env.outputs.env }})
        env:
          RENDER_API_KEY: ${{ secrets[format('RENDER_API_KEY_{0}', needs.resolve-env.outputs.env)] }}
          RENDER_SERVICE_ID: ${{ secrets[format('RENDER_SERVICE_ID_{0}', needs.resolve-env.outputs.env)] }}
        run: |
          set +e
          HTTP_CODE=$(curl -sS --max-time 60 -o /tmp/render_deploy.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" 2>/tmp/render_curl_err.txt)
          CURL_EXIT=$?
          set -e
          echo "curl exit code: $CURL_EXIT"
          echo "Render deploy HTTP status: $HTTP_CODE"
          if [ -s /tmp/render_deploy.json ]; then
            echo "Render deploy response: $(cat /tmp/render_deploy.json)"
          fi
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "Deploy no Render disparado com sucesso"
            exit 0
          fi
          echo "Falha ao disparar deploy no Render (curl exit=$CURL_EXIT, http=$HTTP_CODE)"
          if [ -s /tmp/render_curl_err.txt ]; then
            echo "curl error: $(cat /tmp/render_curl_err.txt)"
          fi
          exit 1

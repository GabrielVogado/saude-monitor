name: CD - Frontend (Netlify)

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/cd-frontend.yml'
  workflow_dispatch:

jobs:
  # Mapeia a branch/tag para o ambiente de destino.
  #   develop -> dev (desenvolvimento)
  #   main    -> hom (homologação)
  #   tag v*  -> prod (produção)
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=hom" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build web e deploy (${{ needs.resolve-env.outputs.env }})
    needs: resolve-env
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build web (export Expo)
        run: npx expo export --platform web

      - name: Deploy no Netlify (${{ needs.resolve-env.outputs.env }})
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: frontend/dist
          production-branch: main
          deploy-message: "Deploy ${{ github.sha }} (${{ needs.resolve-env.outputs.env }})"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets[format('NETLIFY_AUTH_TOKEN_{0}', needs.resolve-env.outputs.env)] }}
          NETLIFY_SITE_ID: ${{ secrets[format('NETLIFY_SITE_ID_{0}', needs.resolve-env.outputs.env)] }}

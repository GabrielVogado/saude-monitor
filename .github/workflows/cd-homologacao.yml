# Homologacao (HML): cada push na `master` vira uma versao candidata publicada.
#
# Decisao do PO em 22/09/2026: `master` = homologacao; producao fica para `release/<tag>`.
#
#   push em master
#     -> versao   calcula vX.Y.Z-rc.N (X.Y.Z do frontend/app.json, N = proxima rc livre)
#     -> apk      APK `.hom` assinado com a chave de release (cd-mobile-apk.yml)
#     -> backend  Cloud Run `saude-monitor-backend-hom` + smoke tests (cd-backend-google.yml)
#     -> release  confere a URL do APK, cria tag + GitHub Release (pre-release) com o APK
#
# A ordem e o ponto (code-review de 22/09/2026): o APK vem ANTES do backend. Ele e a parte
# que mais falha (Gradle, chave, secrets) e, se falhasse depois do deploy, o backend de
# homologacao ficaria com codigo novo sem rc correspondente -- e o APK da rc anterior,
# na mao dos testadores, falando com uma API que pode ter mudado. Nesta ordem, uma
# falha do APK nao toca no ambiente, e uma falha do backend nao cria tag.
#
# O APK nao precisa esperar o deploy para saber a URL: o Cloud Run publica tambem uma
# URL DETERMINISTICA, `https://<servico>-<numero do projeto>.<regiao>.run.app`
# (conferida em 22/09/2026 no servico de dev, que responde nela). O job `release` bate
# nessa URL antes de criar a tag, para provar que o endereco embutido no APK responde.
#
# Por que o APK instala por cima da rc anterior: mesma chave (secrets ANDROID_RELEASE_*)
# e versionCode = X*1_000_000 + Y*10_000 + Z*100 + N, que so cresce -- o job `versao`
# recusa uma versao menor que a ultima homologada. Ver deploy/android/README.md.
name: CD - Homologação

on:
  push:
    branches: [master]
  # Manual SO na `master` (o job `versao` recusa outra ref): o `cd-backend-google.yml`
  # escolhe o ambiente pela ref, e um disparo da `develop` publicaria o backend de DEV
  # e uma "rc de homologacao" apontando para ele.
  workflow_dispatch:

# Uma rc por vez, e a em andamento nunca e cancelada (deixaria o pipeline pela metade).
# Limite do GitHub: o grupo guarda UMA execucao pendente -- com tres merges seguidos, o
# segundo e descartado quando o terceiro chega. Nao se perde codigo: o terceiro contem o
# segundo, e o changelog da rc lista os dois PRs; so aquele commit intermediario nao
# ganha rc propria.
concurrency:
  group: homologacao
  cancel-in-progress: false

env:
  # URL deterministica do servico de homologacao (ver o cabecalho).
  API_URL_HOM: https://saude-monitor-backend-hom-767615581088.southamerica-east1.run.app

permissions:
  contents: read

jobs:
  versao:
    name: Calcular versão
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calc.outputs.tag }}
      version_name: ${{ steps.calc.outputs.version_name }}
      version_code: ${{ steps.calc.outputs.version_code }}
      anterior: ${{ steps.calc.outputs.anterior }}
      api_url: ${{ steps.calc.outputs.api_url }}
    steps:
      - name: Só a master publica homologação
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "ERRO: homologacao so e publicada a partir da master (ref atual: $GITHUB_REF)."
            exit 1
          fi

      # So o app.json e os NOMES das tags interessam: clone raso + `ls-remote`, em vez de
      # baixar a historia inteira (que inclui APKs versionados no passado).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular vX.Y.Z-rc.N
        id: calc
        run: |
          set -euo pipefail
          TAGS=$(git ls-remote --tags origin 'refs/tags/v*-rc.*' | sed -E 's#.*refs/tags/##; s#\^\{\}$##' | sort -u)
          BASE=$(node -p "require('./frontend/app.json').expo.version")
          if ! [[ "$BASE" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERRO: expo.version '$BASE' em frontend/app.json nao e X.Y.Z."
            exit 1
          fi
          X=${BASH_REMATCH[1]}; Y=${BASH_REMATCH[2]}; Z=${BASH_REMATCH[3]}
          # Limites do esquema de versionCode (2 digitos para Y, Z e N).
          if [ "$Y" -gt 99 ] || [ "$Z" -gt 99 ] || [ "$X" -gt 2000 ]; then
            echo "ERRO: $BASE fora do esquema de versionCode (Y e Z ate 99, X ate 2000)."
            exit 1
          fi

          codigo() { # vX.Y.Z-rc.N -> versionCode
            [[ "$1" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-rc\.([0-9]+)$ ]] || { echo 0; return; }
            echo $(( 10#${BASH_REMATCH[1]}*1000000 + 10#${BASH_REMATCH[2]}*10000 + 10#${BASH_REMATCH[3]}*100 + 10#${BASH_REMATCH[4]} ))
          }

          # Re-execucao no mesmo commit reaproveita a rc que ja aponta para ele, em vez de
          # queimar um numero novo para o mesmo codigo.
          EXISTENTE=$(git ls-remote --tags origin "refs/tags/v${BASE}-rc.*" | awk -v sha="$GITHUB_SHA" '$1 == sha { sub("refs/tags/", "", $2); print $2 }' | sort -V | tail -1)
          if [ -n "$EXISTENTE" ]; then
            N=${EXISTENTE##*-rc.}
          else
            ULTIMA=$(printf '%s\n' "$TAGS" | grep -E "^v${BASE//./\\.}-rc\.[0-9]+$" | sed 's/.*-rc\.//' | sort -n | tail -1 || true)
            N=$(( ${ULTIMA:-0} + 1 ))
          fi
          if [ "$N" -gt 99 ]; then
            echo "ERRO: v${BASE} ja tem 99 rcs. Suba a versao em frontend/app.json."
            exit 1
          fi
          TAG="v${BASE}-rc.${N}"
          CODE=$(codigo "$TAG")

          # A maior rc ja homologada (qualquer X.Y.Z): o APK novo precisa de versionCode
          # MAIOR, senao o Android recusa instalar por cima. Pega quem baixou a versao em
          # frontend/app.json por engano.
          MAIOR=0; ANTERIOR=""
          for T in $TAGS; do
            [ "$T" = "$TAG" ] && continue
            C=$(codigo "$T")
            if [ "$C" -gt "$MAIOR" ]; then MAIOR=$C; ANTERIOR=$T; fi
          done
          if [ -z "$EXISTENTE" ] && [ "$CODE" -le "$MAIOR" ]; then
            echo "ERRO: $TAG (versionCode $CODE) nao e maior que $ANTERIOR ($MAIOR)."
            echo "      O APK nao instalaria por cima. Suba expo.version em frontend/app.json."
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version_name=${BASE}-rc.${N}"
            echo "version_code=$CODE"
            echo "anterior=$ANTERIOR"
            echo "api_url=$API_URL_HOM"
          } >> "$GITHUB_OUTPUT"
          echo "🏷️ \`$TAG\` · versionCode \`$CODE\` · anterior: \`${ANTERIOR:-nenhuma}\`" >> "$GITHUB_STEP_SUMMARY"

  apk:
    name: APK HML
    needs: versao
    uses: ./.github/workflows/cd-mobile-apk.yml
    with:
      ambiente: hom
      api_url: ${{ needs.versao.outputs.api_url }}
      version_name: ${{ needs.versao.outputs.version_name }}
      version_code: ${{ needs.versao.outputs.version_code }}
    secrets: inherit

  backend:
    name: Backend HML
    needs: [versao, apk]
    uses: ./.github/workflows/cd-backend-google.yml
    permissions:
      contents: read
      id-token: write

  release:
    name: Tag e GitHub Release
    needs: [versao, backend, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.apk.outputs.artefato }}
          path: apk

      # O APK foi construido com a URL deterministica; o deploy devolve a URL de hash.
      # Antes de publicar a rc, prova que o endereco EMBUTIDO no APK responde -- senao os
      # testadores instalariam um app sem backend.
      - name: Conferir a URL embutida no APK
        env:
          API_URL: ${{ needs.versao.outputs.api_url }}
        run: |
          for TENTATIVA in 1 2 3 4 5 6; do
            CODIGO=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$API_URL/actuator/health" || echo 000)
            echo "tentativa $TENTATIVA -> HTTP $CODIGO"
            [ "$CODIGO" = "200" ] && exit 0
            sleep 10
          done
          echo "ERRO: $API_URL (embutida no APK) nao respondeu 200."
          exit 1

      - name: Criar tag e Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.versao.outputs.tag }}
          VERSION_NAME: ${{ needs.versao.outputs.version_name }}
          VERSION_CODE: ${{ needs.versao.outputs.version_code }}
          ANTERIOR: ${{ needs.versao.outputs.anterior }}
          ARQUIVO: ${{ needs.apk.outputs.arquivo }}
          API_URL: ${{ needs.versao.outputs.api_url }}
        run: |
          set -euo pipefail
          test -s "apk/$ARQUIVO" || { echo "ERRO: apk/$ARQUIVO nao veio no artefato."; exit 1; }

          # Re-execucao: a Release ja existe, so troca o APK.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "apk/$ARQUIVO" --clobber -R "$GITHUB_REPOSITORY"
            echo "♻️ Release \`$TAG\` já existia — APK substituído." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Changelog pela API de notas do GitHub, desde a rc anterior (PRs mergeados).
          ARGS=(-f "tag_name=$TAG" -f "target_commitish=$GITHUB_SHA")
          [ -n "$ANTERIOR" ] && ARGS+=(-f "previous_tag_name=$ANTERIOR")
          MUDANCAS=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" --jq .body)

          {
            echo "## Radar Saúde HML $VERSION_NAME"
            echo ""
            echo "- **Instalar:** baixe \`$ARQUIVO\` abaixo e abra no Android. Se já houver uma versão HML instalada, ela é **atualizada** (sem desinstalar, dados mantidos)."
            echo "- **Backend de homologação:** $API_URL"
            echo "- **versionCode:** $VERSION_CODE · commit \`${GITHUB_SHA:0:7}\`"
            echo ""
            echo "$MUDANCAS"
          } > notas.md

          gh release create "$TAG" "apk/$ARQUIVO" \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Radar Saúde HML $VERSION_NAME" \
            --notes-file notas.md

          URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "📦 [$TAG]($URL) publicado com \`$ARQUIVO\`." >> "$GITHUB_STEP_SUMMARY"

# Build do APK no proprio GitHub Actions, sem consumir cota do EAS.
#
# POR QUE ESTE WORKFLOW EXISTE
#
# O cd-mobile-eas.yml disparava a cada push em `frontend/**`. Foram 18 builds em
# agosto e 20 nos tres primeiros dias de setembro de 2026, contra os 30/mes do free
# tier do EAS -- a cota foi gasta em builds automaticos que ninguem pediu. A saida
# nao e so trocar de construtor: e parar de construir sem que alguem peca.
#
# O projeto nao precisa do EAS para gerar APK. O diretorio frontend/android/ esta
# versionado por inteiro (gradlew, build.gradle e o CMakeLists customizado que
# desativa IPO/LTO por causa do NDK 27), e o repositorio e PUBLICO, entao minutos de
# Actions sao gratuitos e ilimitados.
#
# O EAS continua, so para o AAB de loja e SO POR EXECUCAO MANUAL -- que e onde os
# creditos rendem, e e raro.
# VALIDADO em 03/09/2026, antes do merge: run 33818555520, 21 min 13 s, APK de 23 MB
# publicado como artefato. A validacao usou um gatilho de push temporario, ja removido
# -- um workflow novo so aceita workflow_dispatch depois de estar na branch padrao.
name: CD - Mobile (APK via Gradle)

on:
  # Automatico por decisao do PO em 03/09/2026: toda entrega nas branches de
  # integracao e de producao deixa um APK pronto para baixar, sem ninguem precisar
  # lembrar de pedir. O que estourou a cota do EAS nao foi o automatismo em si -- foi
  # ele custando credito. Aqui nao custa: o repositorio e publico.
  #
  # PRECONDICAO para isso ser confortavel: o secret ANDROID_KEYSTORE_BASE64. Sem ele
  # cada build gera uma keystore nova, e instalar um APK por cima do anterior falha
  # com "app nao instalado" -- o testador precisa desinstalar e perde login,
  # dispositivoId e feedback pendente. Automatizar sem o secret entrega o incomodo
  # mais vezes. O nome do artefato avisa quando e esse o caso.
  # SEM gatilho de pull_request, e a contrapartida fica registrada: o ci.yml valida
  # so o `expo export --platform web`, entao o build NATIVO (Gradle/NDK) e exercitado
  # pela primeira vez DEPOIS do merge. Uma mudanca que quebre o nativo deixa a develop
  # vermelha em vez de ser barrada no PR. Adicionar `pull_request` custaria ~21 min por
  # PR de frontend -- gratuito em repositorio publico, mas e decisao do PO, nao efeito
  # colateral de um PR de infraestrutura.
  push:
    branches: [develop, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/cd-mobile-apk.yml'

  workflow_dispatch:
    inputs:
      variante:
        description: Variante do build
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: read

# Uma sequencia de merges enfileiraria varios builds de ~21 min, e so o ultimo
# interessa. O `event_name` no grupo ja isola push de dispatch -- um push nunca
# cancelaria um APK que alguem pediu a mao. O `cancel-in-progress` condicional que
# havia aqui era redundante com isso, e tinha um efeito nao pretendido: SERIALIZAVA
# dois dispatches na mesma ref, deixando o segundo esperando ~21 min sem indicacao de
# fila.
concurrency:
  group: apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (${{ inputs.variante || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-apk-

      - name: Instalar dependências
        run: npm ci

      # A variante `release` assina com `signingConfigs.debug` (android/app/build.gradle),
      # e o debug.keystore e ignorado pelo .gitignore (`*.keystore`). Sem ele o Gradle
      # falha na assinatura.
      # ATENCAO ao conteudo do secret: o android/app/build.gradle fixa storePassword
      # `android`, alias `androiddebugkey` e keyPassword `android`, e a variante release
      # reusa esse signingConfig. Uma keystore de upload/release com senha e alias
      # proprios PASSA neste passo e so quebra la no Gradle, com o erro opaco
      # "Keystore was tampered with, or password was incorrect".
      - name: Preparar keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          DESTINO=android/app/debug.keystore

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$DESTINO"
            echo "sufixo=" >> "$GITHUB_OUTPUT"
            echo "✅ Keystore do secret \`ANDROID_KEYSTORE_BASE64\` — assinatura estável entre builds." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Receita padrao do debug.keystore do Android: as credenciais sao publicas e
          # estao fixadas no build.gradle.
          keytool -genkeypair -v -keystore "$DESTINO"             -storepass android -alias androiddebugkey -keypass android             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Android Debug,O=Android,C=US" >/dev/null

          # O aviso abaixo vai para o resumo do job -- que ninguem le ao baixar o
          # artefato. Por isso o estado tambem entra no NOME do arquivo baixado.
          echo "sufixo=-ASSINATURA-EFEMERA" >> "$GITHUB_OUTPUT"

          {
            echo "⚠️ **Keystore gerada nesta execução.** O secret \`ANDROID_KEYSTORE_BASE64\` não está definido."
            echo ""
            echo "A chave muda a cada build, então **APKs de execuções distintas não se atualizam entre si**:"
            echo "instalar por cima falha com \"app não instalado\" e é preciso desinstalar a versão anterior."
            echo ""
            echo "Para assinatura estável, guarde a keystore como secret:"
            echo '```'
            echo '# Linux/macOS'
            echo 'base64 -w0 frontend/android/app/debug.keystore'
            echo ''
            echo '# Windows (PowerShell). NAO use `certutil -encode`: ele emite PEM com'
            echo '# cabecalhos -----BEGIN/END-----, que o `base64 -d` deste passo rejeita.'
            echo '[Convert]::ToBase64String([IO.File]::ReadAllBytes("frontend/android/app/debug.keystore"))'
            echo '```'
            echo ""
            echo "Cole em **Settings > Secrets and variables > Actions > ANDROID_KEYSTORE_BASE64**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build do APK
        env:
          # O bundle JS embutido no APK precisa saber para onde falar. Mesma URL que o
          # scripts/build-apk.js usa no build local.
          #
          # ESTA linha e quem decide o destino do APK, nao o `frontend/app.json`:
          # `src/config/api.js` le `process.env.EXPO_PUBLIC_API_BASE_URL` PRIMEIRO e
          # so cai em `extra.apiBaseUrlAndroid` se ela estiver vazia. Como o padrao
          # abaixo nunca esta vazio, o `app.json` jamais e consultado num APK gerado
          # aqui -- mudar so o `app.json` produziria um APK ainda apontando para o
          # Render, com o diff parecendo correto. Os dois foram virados juntos de
          # proposito.
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || 'https://saude-monitor-backend-dev-uly57kmmia-rj.a.run.app' }}
        working-directory: frontend/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "${{ inputs.variante || 'release' }}" = "debug" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            ./gradlew --no-daemon assembleRelease
          fi

      - name: Localizar o APK
        id: apk
        run: |
          set -euo pipefail
          # `-print -quit` em vez de `| head -1`: com `set -euo pipefail`, o head
          # fechava o pipe e o find morria com SIGPIPE (141), abortando o passo antes
          # do ramo de erro abaixo -- que ficava inalcancavel. O `|| true` cobre o caso
          # de o diretorio nem existir, para a mensagem util ser a que aparece.
          # Escopado a variante construida, e nao a `outputs/apk` inteira: o
          # android/.gitignore DES-ignora `app/build/outputs/apk/**` de proposito
          # (Epico 02), entao um APK versionado no passado seria restaurado pelo
          # checkout e o find poderia devolve-lo em vez do recem-construido -- um APK
          # obsoleto publicado como se fosse novo.
          VARIANTE="${{ inputs.variante || 'release' }}"
          CAMINHO=$(find "android/app/build/outputs/apk/$VARIANTE" -name "*.apk" -newer android/gradlew -print -quit 2>/dev/null || true)
          if [ -z "$CAMINHO" ]; then
            echo "ERRO: nenhum APK foi produzido pelo Gradle."
            exit 1
          fi
          echo "caminho=frontend/$CAMINHO" >> "$GITHUB_OUTPUT"
          TAMANHO=$(du -h "$CAMINHO" | cut -f1)
          echo "📦 APK \`${{ inputs.variante || 'release' }}\` — $TAMANHO — \`$CAMINHO\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          # A branch entra no nome: com gatilho em develop E master, dois artefatos
          # so com o sha seriam indistinguiveis para quem baixa.
          name: apk-${{ github.ref_name }}-${{ inputs.variante || 'release' }}${{ steps.keystore.outputs.sufixo }}-${{ github.sha }}
          path: ${{ steps.apk.outputs.caminho }}
          retention-days: 30
          if-no-files-found: error

# Build do APK no proprio GitHub Actions, sem consumir cota do EAS.
#
# POR QUE ESTE WORKFLOW EXISTE
#
# O cd-mobile-eas.yml disparava a cada push em `frontend/**`. Foram 18 builds em
# agosto e 20 nos tres primeiros dias de setembro de 2026, contra os 30/mes do free
# tier do EAS -- a cota foi gasta em builds automaticos que ninguem pediu. A saida
# nao e so trocar de construtor: e parar de construir sem que alguem peca.
#
# O projeto nao precisa do EAS para gerar APK. O diretorio frontend/android/ esta
# versionado por inteiro (gradlew, build.gradle e o CMakeLists customizado que
# desativa IPO/LTO por causa do NDK 27), e o repositorio e PUBLICO, entao minutos de
# Actions sao gratuitos e ilimitados.
#
# O EAS continua, restrito ao AAB de loja em release/<tag> -- que e onde os creditos
# rendem, e e raro.
# VALIDADO em 03/09/2026, antes do merge: run 33818555520, 21 min 13 s, APK de 23 MB
# publicado como artefato. A validacao usou um gatilho de push temporario, ja removido
# -- um workflow novo so aceita workflow_dispatch depois de estar na branch padrao.
name: CD - Mobile (APK via Gradle)

on:
  # Manual de proposito. O gatilho automatico foi exatamente o que estourou a cota
  # do EAS; um APK e artefato que se pede, nao que se produz a cada merge.
  workflow_dispatch:
    inputs:
      variante:
        description: Variante do build
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: read

jobs:
  apk:
    name: APK (${{ inputs.variante || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-apk-

      - name: Instalar dependências
        run: npm ci

      # A variante `release` assina com `signingConfigs.debug` (android/app/build.gradle),
      # e o debug.keystore e ignorado pelo .gitignore (`*.keystore`). Sem ele o Gradle
      # falha na assinatura.
      - name: Preparar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          DESTINO=android/app/debug.keystore

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$DESTINO"
            echo "✅ Keystore do secret \`ANDROID_KEYSTORE_BASE64\` — assinatura estável entre builds." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Receita padrao do debug.keystore do Android: as credenciais sao publicas e
          # estao fixadas no build.gradle (senha `android`, alias `androiddebugkey`).
          keytool -genkeypair -v -keystore "$DESTINO" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null

          {
            echo "⚠️ **Keystore gerada nesta execução.** O secret \`ANDROID_KEYSTORE_BASE64\` não está definido."
            echo ""
            echo "A chave é diferente a cada build, então **APKs de execuções distintas não se atualizam entre si**:"
            echo "instalar por cima falha com \"app não instalado\" e é preciso desinstalar a versão anterior antes."
            echo ""
            echo "Para ter assinatura estável, guarde a keystore como secret:"
            echo '```'
            echo 'base64 -w0 frontend/android/app/debug.keystore   # no Windows: certutil -encode'
            echo '# cole em Settings > Secrets and variables > Actions > ANDROID_KEYSTORE_BASE64'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build do APK
        env:
          # O bundle JS embutido no APK precisa saber para onde falar. Mesma URL que o
          # scripts/build-apk.js usa no build local.
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || 'https://saude-monitor.onrender.com' }}
        working-directory: frontend/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "${{ inputs.variante || 'release' }}" = "debug" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            ./gradlew --no-daemon assembleRelease
          fi

      - name: Localizar o APK
        id: apk
        run: |
          set -euo pipefail
          CAMINHO=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$CAMINHO" ]; then
            echo "ERRO: nenhum APK foi produzido pelo Gradle."
            exit 1
          fi
          echo "caminho=frontend/$CAMINHO" >> "$GITHUB_OUTPUT"
          TAMANHO=$(du -h "$CAMINHO" | cut -f1)
          echo "📦 APK \`${{ inputs.variante || 'release' }}\` — $TAMANHO — \`$CAMINHO\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.variante || 'release' }}-${{ github.sha }}
          path: ${{ steps.apk.outputs.caminho }}
          retention-days: 30
          if-no-files-found: error

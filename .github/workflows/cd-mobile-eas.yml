# ⚠️ RESTRITO AO AAB DE LOJA desde 03/09/2026.
#
# Este workflow disparava a cada push em `frontend/**`. Foram 18 builds em agosto e 20
# nos três primeiros dias de setembro, contra os 30/mês do free tier do EAS — a cota
# foi consumida por builds automáticos que ninguém pediu, e o projeto ficou sem
# conseguir gerar APK.
#
# O APK interno passou para o `cd-mobile-apk.yml`, que constrói com Gradle no próprio
# GitHub Actions: `frontend/android/` está versionado por inteiro e o repositório é
# público, então não custa cota nem minutos.
#
# O EAS fica para o que só ele faz bem: o AAB assinado para a Play Store, a partir de
# uma versão fixada. É raro, e é onde os créditos rendem.
name: CD - Mobile (EAS Build)

on:
  push:
    # SEM filtro de `paths`, de proposito. Com ele, este workflow nao dispararia
    # NUNCA: o release.yml cria a branch com `git checkout -b` + `git push`, sem
    # nenhum commit novo, e um push de criacao de branch nao carrega diff que case
    # com `paths`. Antes isso passava despercebido porque os pushes em develop e
    # master mantinham o EAS exercitado; agora `release/**` e o unico gatilho, e o
    # filtro o tornaria letra morta -- a release seria gerada, nenhum AAB sairia, e
    # nada reportaria falha.
    branches: ['release/**']
  workflow_dispatch:

jobs:
  # Mapeia a branch para o perfil de build do EAS.
  #   release/<tag> -> production (AAB para loja)
  #
  # develop e master saíram do gatilho: o APK interno deles é feito pelo
  # cd-mobile-apk.yml, com Gradle e sem cota. O perfil `preview` só é alcançável
  # agora por workflow_dispatch a partir de uma branch que não seja release/*.
  resolve-profile:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.resolve.outputs.profile }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "profile=production" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fora de release/*, o perfil seria `preview` -- exatamente o APK interno
          # que o cd-mobile-apk.yml produz de graca. Rodar aqui gastaria um credito
          # do EAS para obter o mesmo artefato, que e como a cota foi consumida ate
          # 03/09/2026. A politica do workflow passa a ser cobrada por ele mesmo.
          echo "ERRO: este workflow existe so para o AAB de loja, a partir de release/*."
          echo "Para APK interno use 'CD - Mobile (APK via Gradle)', que nao gasta cota."
          echo "Ref recebida: ${{ github.ref }}"
          exit 1

  eas-build:
    name: EAS Build (${{ needs.resolve-profile.outputs.profile }})
    needs: resolve-profile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERRO: secret EXPO_TOKEN nao configurado no GitHub"
            exit 1
          fi
          echo "EXPO_TOKEN configurado (len=${#EXPO_TOKEN})"

      - name: Configurar EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build no EAS (${{ needs.resolve-profile.outputs.profile }})
        run: |
          npx eas-cli build \
            --platform android \
            --profile ${{ needs.resolve-profile.outputs.profile }} \
            --non-interactive \
            --no-wait

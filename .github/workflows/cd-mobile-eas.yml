name: CD - Mobile (EAS Build)

on:
  push:
    branches: [develop, main, 'release/**']
    paths:
      - 'frontend/**'
      - '.github/workflows/cd-mobile-eas.yml'
  workflow_dispatch:

jobs:
  # Mapeia a branch para o perfil de build do EAS.
  #   develop     -> preview (APK interno)
  #   main        -> preview (APK interno)
  #   release/<tag> -> production (AAB para loja)
  resolve-profile:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.resolve.outputs.profile }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "profile=production" >> "$GITHUB_OUTPUT"
          else
            echo "profile=preview" >> "$GITHUB_OUTPUT"
          fi

  eas-build:
    name: EAS Build (${{ needs.resolve-profile.outputs.profile }})
    needs: resolve-profile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERRO: secret EXPO_TOKEN nao configurado no GitHub"
            exit 1
          fi
          echo "EXPO_TOKEN configurado (len=${#EXPO_TOKEN})"

      - name: Configurar EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build no EAS (${{ needs.resolve-profile.outputs.profile }})
        run: |
          npx eas-cli build \
            --platform android \
            --profile ${{ needs.resolve-profile.outputs.profile }} \
            --non-interactive \
            --no-wait

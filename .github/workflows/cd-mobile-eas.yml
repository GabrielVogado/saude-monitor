# ⚠️ RESTRITO AO AAB DE LOJA em 03/09/2026.
#
# Este workflow disparava a cada push em `frontend/**`. Foram 18 builds em agosto e 20
# nos três primeiros dias de setembro, contra os 30/mês do free tier do EAS — a cota
# foi consumida por builds automáticos que ninguém pediu, e o projeto ficou sem
# conseguir gerar APK.
#
# O APK interno passou para o `cd-mobile-apk.yml`, que constrói com Gradle no próprio
# GitHub Actions: `frontend/android/` está versionado por inteiro e o repositório é
# público, então não custa cota nem minutos.
#
# O EAS fica para o que só ele faz bem: o AAB assinado para a Play Store, a partir de
# uma versão fixada. É raro, e é onde os créditos rendem.
name: CD - Mobile (EAS Build)

on:
  # SO MANUAL, por decisao do PO em 03/09/2026. Publicar na loja e ato deliberado --
  # ninguem quer um AAB porque uma branch nasceu.
  #
  # De quebra, some uma armadilha que um gatilho em `release/**` teria: o release.yml
  # faz checkout com actions/checkout@v4 (persist-credentials padrao) e empurra a
  # branch com o GITHUB_TOKEN -- e a REGRA DE RECURSAO do GitHub nao cria execucao de
  # workflow nenhuma para push feito com esse token. Nao e questao de filtro de
  # `paths` nem de a branch nascer sem commit: NADA dispararia, e o silencio pareceria
  # normal. Sem gatilho automatico, ninguem espera por um disparo que nao vem.
  workflow_dispatch:

jobs:
  # Mapeia a branch para o perfil de build do EAS.
  #   release/<tag> -> production (AAB para loja)
  #
  # develop e master saíram do gatilho: o APK interno deles é feito pelo
  # cd-mobile-apk.yml, com Gradle.
  #
  # O perfil `preview` ficou INALCANÇÁVEL de propósito — a guarda logo abaixo recusa
  # qualquer ref que não seja release/*. Ele produzia exatamente o APK interno que o
  # Gradle agora entrega de graça, e era por ali que a cota escorria. Consequência a
  # registrar: o bloco `preview` do frontend/eas.json virou configuração morta; fica
  # como está caso a política mude, mas nenhum caminho o alcança hoje.
  resolve-profile:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.resolve.outputs.profile }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "profile=production" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fora de release/*, o perfil seria `preview` -- exatamente o APK interno
          # que o cd-mobile-apk.yml produz de graca. Rodar aqui gastaria um credito
          # do EAS para obter o mesmo artefato, que e como a cota foi consumida ate
          # 03/09/2026. A politica do workflow passa a ser cobrada por ele mesmo.
          echo "ERRO: este workflow existe so para o AAB de loja, a partir de release/*."
          echo "Para APK interno use 'CD - Mobile (APK via Gradle)', que nao gasta cota."
          echo "Ref recebida: ${{ github.ref }}"
          exit 1

  eas-build:
    name: EAS Build (${{ needs.resolve-profile.outputs.profile }})
    needs: resolve-profile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERRO: secret EXPO_TOKEN nao configurado no GitHub"
            exit 1
          fi
          echo "EXPO_TOKEN configurado (len=${#EXPO_TOKEN})"

      - name: Configurar EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Barreira acrescentada em 05/09/2026. Este workflow NAO define
      # `EXPO_PUBLIC_API_BASE_URL`, entao o bundle cai em `extra.apiBaseUrlAndroid`
      # do `app.json` -- que desde a virada para o Cloud Run nomeia explicitamente o
      # servico de DESENVOLVIMENTO (`saude-monitor-backend-dev-...`). Sem esta
      # verificacao, um `release/1.0.0` produziria um AAB de LOJA falando com o
      # backend de dev: `--max-instances=1`, seed de admin desligado e a base Atlas
      # de desenvolvimento.
      #
      # Antes da virada o valor era `saude-monitor.onrender.com`, um nome neutro
      # quanto a ambiente -- o acoplamento existia igual, so era invisivel.
      #
      # FALHA em vez de avisar e seguir: um AAB de loja apontando para o ambiente
      # errado nao da erro nenhum na esteira, so na mao do usuario final. Enquanto
      # o ambiente de producao nao existir (pendencia P-006), o certo e nao produzir
      # o artefato.
      - name: Verificar o destino da API do build de loja
        env:
          API_BASE_URL_PROD: ${{ vars.EXPO_PUBLIC_API_BASE_URL_PROD }}
        run: |
          if [ -z "${API_BASE_URL_PROD:-}" ]; then
            echo "ERRO: a variavel de repositorio EXPO_PUBLIC_API_BASE_URL_PROD nao existe."
            echo ""
            echo "Sem ela o bundle usa extra.apiBaseUrlAndroid do app.json, que hoje aponta"
            echo "para o backend de DESENVOLVIMENTO no Cloud Run. Um AAB de loja nao pode"
            echo "sair apontando para dev."
            echo ""
            echo "Defina em Settings > Secrets and variables > Actions > Variables quando o"
            echo "ambiente de producao existir (P-006)."
            exit 1
          fi
          echo "destino do build de loja: $API_BASE_URL_PROD"

      # NAO adianta exportar EXPO_PUBLIC_API_BASE_URL aqui: `eas build` empacota o
      # projeto e compila nos servidores da Expo, e variavel de ambiente do runner
      # do GitHub nao viaja junto. A injecao real tem de sair de `eas.json`
      # (`build.production.env`) ou das environment variables do proprio EAS.
      # Por isso o passo acima e um PORTAO, nao uma correcao: ele impede o AAB
      # errado de nascer, mas quem define o destino continua sendo o `app.json`
      # ate `eas.json` ganhar o `env` do perfil de producao. Fica junto da P-006.
      - name: Build no EAS (${{ needs.resolve-profile.outputs.profile }})
        run: |
          npx eas-cli build \
            --platform android \
            --profile ${{ needs.resolve-profile.outputs.profile }} \
            --non-interactive \
            --no-wait

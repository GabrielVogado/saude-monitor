name: CI - Build e Testes

on:
  # `master` no lugar de `main`: a branch nunca existiu neste repositorio, entao ate
  # 03/09/2026 NENHUM push ou PR para a branch de producao rodava CI. Uma promocao
  # para producao nao era validada por nada.
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Compilar e rodar testes
        # `build` inclui `check`, que agora depende da verificação de cobertura
        # do JaCoCo: queda abaixo do piso reprova o PR (DOD-01 / E8-08).
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Publicar relatório de cobertura (backend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/build/reports/jacoco/test
          retention-days: 14
          if-no-files-found: ignore

  frontend:
    name: Frontend (Expo Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        # Atenção: este passo não verifica o código. O `tsconfig.json` tem
        # `checkJs: false` e o projeto é 100% `.js` — o `tsc` não tem o que
        # olhar. Fica no lugar porque vira gate de verdade quando o ARQ-11
        # (tipagem incremental) começar. Quem verifica hoje é o lint abaixo.
        run: npm run typecheck

      - name: Lint (ESLint)
        # Erro reprova o PR. Aviso também, quando passa do piso congelado em
        # `package.json` — mesma lógica do piso de cobertura (E8-13 / ENG-02).
        run: npm run lint

      - name: Testes (Jest) com cobertura
        # O piso configurado em `jest.config.js` reprova o PR quando a cobertura
        # cai — mesma porta do backend (DOD-01 / E8-08).
        run: npm run test:coverage -- --ci --maxWorkers=2

      - name: Publicar relatório de cobertura (frontend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage
          retention-days: 14
          if-no-files-found: ignore

      - name: Build web (export Expo)
        run: npx expo export --platform web

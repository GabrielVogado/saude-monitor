name: Release - Gerar branch de produção

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex.: 1.0.0)'
        required: true
        type: string

jobs:
  branch:
    name: Criar branch release/${{ inputs.version }} a partir da master
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Validar que está na master
        run: |
          if [[ "$(git rev-parse --abbrev-ref HEAD)" != "master" ]]; then
            echo "A release só pode ser gerada a partir da master."
            exit 1
          fi

      - name: Criar e enviar a branch release/${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/${{ inputs.version }}"
          git push origin "release/${{ inputs.version }}"

# SonarQube Cloud: Painel Admin (Angular). Análise disparada pelo ci.yml.
# Organização e chave precisam ser exatamente as criadas no SonarQube Cloud
# (passo a passo em Documentos/10-git-flow/MANUAL.md §4.4).
sonar.organization=gabrielvogado
sonar.projectKey=gabrielvogado_saude-monitor-painel-admin
sonar.projectName=Radar Saúde - Admin

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts
sonar.exclusions=src/**/*.spec.ts

# lcov gerado por `ng test --coverage` (Vitest + @vitest/coverage-v8).
sonar.javascript.lcov.reportPaths=coverage/admin/lcov.info
sonar.sourceEncoding=UTF-8

<main class="relative grid min-h-screen place-items-center overflow-hidden bg-gradient-to-br from-brand-700 via-brand-500 to-brand-400 px-4">
  <!-- ondas de radar (decorativas) -->
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 opacity-20">
    <div class="absolute left-1/2 top-[-12rem] h-[30rem] w-[30rem] -translate-x-1/2 rounded-full border-2 border-white/40"></div>
    <div class="absolute left-1/2 top-[-7rem] h-[20rem] w-[20rem] -translate-x-1/2 rounded-full border-2 border-white/30"></div>
    <div class="absolute left-1/2 top-[-2rem] h-[11rem] w-[11rem] -translate-x-1/2 rounded-full border-2 border-white/20"></div>
  </div>

  <section
    class="relative w-full max-w-sm rounded-2xl bg-surface-card p-8 shadow-2xl ring-1 ring-black/5 animate-[fadeInUp_0.5s_ease-out]"
    aria-labelledby="titulo"
  >
    <div class="mb-7 flex flex-col items-center text-center">
      <img src="logo-radar-saude.png" alt="Radar Saúde" class="h-16 w-16 rounded-2xl shadow-md" />
      <h1 id="titulo" class="mt-4 text-xl font-bold tracking-tight text-ink">Painel Administrativo</h1>
      <p class="mt-1 text-sm text-ink-soft">Radar Saúde — acesso restrito</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate class="space-y-4">
      <label class="block">
        <span class="mb-1.5 block text-sm font-semibold text-ink">E-mail</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="username"
          [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
          aria-describedby="erro-email"
          class="w-full rounded-lg border border-outline-soft bg-white px-3 py-2.5 text-ink outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-200 aria-[invalid=true]:border-danger-500 aria-[invalid=true]:ring-danger-100"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span id="erro-email" class="mt-1 block text-[0.8125rem] font-medium text-danger-500">Informe um e-mail válido.</span>
        }
      </label>

      <label class="block">
        <span class="mb-1.5 block text-sm font-semibold text-ink">Senha</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
          aria-describedby="erro-senha"
          class="w-full rounded-lg border border-outline-soft bg-white px-3 py-2.5 text-ink outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-200 aria-[invalid=true]:border-danger-500 aria-[invalid=true]:ring-danger-100"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span id="erro-senha" class="mt-1 block text-[0.8125rem] font-medium text-danger-500">Informe a senha.</span>
        }
      </label>

      @if (erro(); as mensagem) {
        <p class="rounded-lg border border-danger-100 bg-danger-100/40 px-3 py-2.5 text-sm font-medium text-danger-700" role="alert">
          {{ mensagem }}
        </p>
      }

      <button
        type="submit"
        [disabled]="carregando()"
        class="w-full rounded-lg bg-gradient-to-r from-brand-500 to-brand-400 px-4 py-2.5 font-semibold text-white shadow-sm transition hover:shadow-md hover:brightness-110 active:scale-[0.99] disabled:cursor-progress disabled:opacity-70"
      >
        <span class="inline-flex items-center justify-center gap-2">
          @if (carregando()) {
            <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
            Entrando…
          } @else {
            Entrar
          }
        </span>
      </button>
    </form>
  </section>
</main>

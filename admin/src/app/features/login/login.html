<main class="login">
  <section class="cartao" aria-labelledby="titulo">
    <h1 id="titulo" class="titulo">Painel Administrativo</h1>
    <p class="subtitulo">Radar Saúde — acesso restrito</p>

    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <label class="campo">
        <span class="rotulo">E-mail</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="username"
          [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
          aria-describedby="erro-email"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span id="erro-email" class="erro-campo">Informe um e-mail válido.</span>
        }
      </label>

      <label class="campo">
        <span class="rotulo">Senha</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
          aria-describedby="erro-senha"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span id="erro-senha" class="erro-campo">Informe a senha.</span>
        }
      </label>

      @if (erro(); as mensagem) {
        <p class="erro-geral" role="alert">{{ mensagem }}</p>
      }

      <button type="submit" class="botao" [disabled]="carregando()">
        {{ carregando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </section>
</main>

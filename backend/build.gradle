plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.0.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.com.saude_monitor.api'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Carrega variáveis de ambiente do arquivo .env na raiz do projeto (desenvolvimento local).
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// JSON (ObjectMapper + JavaTimeModule p/ Instant): auto-config Jackson + serialização de respostas
	implementation 'org.springframework.boot:spring-boot-starter-json'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv'
	// Relatorio PDF de exportacao de dados do titular (E5-03 / LGPD art. 18).
	// OpenPDF (MPL-2.0 / LGPL-2.1) usado como biblioteca nao modificada.
	implementation 'com.github.librepdf:openpdf:2.0.3'
	// Leitura de arquivos .dbf (atributos do seed de estabelecimentos — Épico 01).
	// Grupo com.github.albfernandez (fork mantido do JavaDBF original com.linuxense).
	implementation 'com.github.albfernandez:javadbf:1.14.1'
	// JWT (F0-01): access + refresh tokens assinados HS256
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Testcontainers MongoDB para testes de contexto (usa Docker, disponível no CI).
	testImplementation 'org.testcontainers:mongodb:1.20.4'
	testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/**
 * Fora da medição de cobertura: código sem lógica de decisão a testar — DTOs e
 * records de entrada/saída, documentos do MongoDB, eventos e a classe `main`.
 * Incluí-los inflaria o percentual sem dizer nada sobre a qualidade da suíte.
 */
ext.excluidosDaCobertura = [
	'**/SaudeMonitorApplication*',
	'**/dto/**',
	'**/document/**',
	'**/event/**',
]

tasks.named('test') {
	useJUnitPlatform()
	// A medição acompanha todo `test`: sem isso o relatório só existiria quando
	// alguém lembrasse de pedi-lo explicitamente (DOD-01 / E8-08).
	finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
	toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')

	reports {
		// XML alimenta ferramentas de análise; HTML é o relatório legível.
		xml.required = true
		html.required = true
	}

	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: excluidosDaCobertura)
	}))
}

/**
 * Piso de cobertura. Começa no patamar medido hoje, arredondado para baixo: a
 * função da porta é impedir regressão, não reprovar o código existente. Subir o
 * número é decisão consciente de sprint, registrada no backlog (E8-08).
 */
tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('jacocoTestReport')

	violationRules {
		rule {
			limit {
				counter = 'INSTRUCTION'
				value = 'COVEREDRATIO'
				// medido hoje: 67,49%
				minimum = 0.65
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				// medido hoje: 51,78%
				minimum = 0.50
			}
		}
	}

	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: excluidosDaCobertura)
	}))
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

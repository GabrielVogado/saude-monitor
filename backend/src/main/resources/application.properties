spring.application.name=saude-monitor

# MongoDB / Percona MongoDB
# Spring Boot 4.0 renomeou o prefixo de spring.data.mongodb.* para spring.mongodb.*
spring.mongodb.uri=mongodb://${MONGO_USER:saude_monitor_user}:${MONGO_PASSWORD:saude_monitor_pass}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:saude_monitor}?authSource=${MONGO_AUTH_DB:admin}
# Cria automaticamente os índices declarados (@Indexed, @GeoSpatialIndexed 2dsphere, @CompoundIndex).
spring.mongodb.auto-index-creation=true

# ---------------------------------------------------------------------
# Importação de estabelecimentos de saúde (Épico 01 — CNES: Hospitais/UPAs/UBS)
# Desabilitada por padrão. Habilite e aponte para o arquivo quando os dados
# (especificação do agente Rafael) estiverem disponíveis.
# ---------------------------------------------------------------------
app.importacao.estabelecimentos.enabled=false
app.importacao.estabelecimentos.caminho-arquivo=D:/saude-monitor/multiplas_camadas_saude_14/estabelecimentos.csv
app.importacao.estabelecimentos.formato=CSV
app.importacao.estabelecimentos.raio-geofence-metros=150.0
app.importacao.estabelecimentos.uf-padrao=DF

# ---------------------------------------------------------------------
# Seed de estabelecimentos a partir de DBF (atributos) + SHP (geometria)
# Roda no startup (ApplicationRunner) quando app.seed.enabled=true.
# Idempotente:
#   modo=skip-if-not-empty (padrão) → só semeia se a coleção hospitais estiver VAZIA;
#   modo=upsert                   → re-importa fazendo upsert por codigoCnes/importKey.
# As coordenadas (lat/lon) vêm do .shp; o .dbf carrega apenas os atributos.
# ---------------------------------------------------------------------
app.seed.enabled=true
app.seed.path=data/
app.seed.codepage=UTF-8
app.seed.modo=skip-if-not-empty
app.seed.lote=DBF_SHP_SEED
app.seed.tolerancia-bbox=0.05
# Raio do geofence circular por categoria (metros) — Especificação §3.6.
app.seed.raio-hospital=200.0
app.seed.raio-upa=150.0
app.seed.raio-ubs=100.0
app.seed.raio-policlinica=150.0
app.seed.raio-caps=150.0
app.seed.raio-centro-especializado=150.0
app.seed.raio-outro=150.0

# ---------------------------------------------------------------------
# Segurança / JWT (F0-01)
# Access token: 15 min · Refresh token: 30 dias (rotação no refresh)
# IMPORTANTE (produção): sobrescrever JWT_SECRET via variável de ambiente com
# chave >= 32 bytes (HS256). O valor abaixo é apenas para desenvolvimento local.
# ---------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:saude-monitor-dev-secret-key-2026-change-me-32bytes-min}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000

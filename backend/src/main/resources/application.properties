spring.application.name=saude-monitor

# Java 25: usa virtual threads para atender requisições bloqueantes sem alterar
# os contratos MVC, MongoDB ou de segurança da aplicação.
spring.threads.virtual.enabled=true

# MongoDB / Percona MongoDB
# Spring Boot 4.0 moveu apenas as propriedades de CONEXAO de spring.data.mongodb.*
# para spring.mongodb.* (modulo spring-boot-mongodb: uri, host, port, database...).
# As propriedades de MAPEAMENTO continuam em spring.data.mongodb.* (modulo
# spring-boot-data-mongodb) -- ver META-INF/spring-configuration-metadata.json de
# cada modulo. Escrever auto-index-creation sob o prefixo de conexao nao falha: a
# chave e ignorada em silencio e nenhum indice e criado (BUG-07).
# Se MONGO_URI for definida (ex.: Atlas mongodb+srv://), ela tem prioridade.
# Caso contrário, monta a URI a partir das variáveis individuais (MongoDB local/Docker).
spring.mongodb.uri=${MONGO_URI:mongodb://${MONGO_USER:saude_monitor_user}:${MONGO_PASSWORD:saude_monitor_pass}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:saude_monitor}?authSource=${MONGO_AUTH_DB:admin}}
# Cria automaticamente os índices declarados (@Indexed, @GeoSpatialIndexed 2dsphere, @CompoundIndex).
spring.data.mongodb.auto-index-creation=true

# Health check do MongoDB desabilitado: o MongoHealthIndicator executa `hello` no banco
# `local`, que o MongoDB Atlas restringe para usuários comuns (mesmo com clusterMonitor),
# fazendo o /actuator/health retornar DOWN. A aplicação continua funcionando normalmente.
management.health.mongo.enabled=false
management.health.mongodb.enabled=false

# ---------------------------------------------------------------------
# Métricas de latência e erro por endpoint (E8-06). `/actuator/prometheus`
# fica protegido no SecurityConfig (papel ADMIN) — não é um contrato público
# como o OpenAPI (E8-09); expõe detalhe operacional interno.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus,metrics
# Histograma do timer http.server.requests, por combinação de método+URI (tag "uri" já
# vem como o padrão da rota do Spring MVC, ex. /api/v1/hospitais/{id}, não a URL
# expandida — sem risco de explosão de cardinalidade). p50/p95/p99 por endpoint se
# calculam a partir dos buckets em tempo de consulta (`histogram_quantile()` no
# Prometheus/Grafana) — é o padrão da ferramenta, não um valor pré-computado aqui.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.prometheus.metrics.export.enabled=true

# ---------------------------------------------------------------------
# Importação de estabelecimentos de saúde (Épico 01 — CNES: Hospitais/UPAs/UBS)
# Desabilitada por padrão. Habilite e aponte para o arquivo quando os dados
# (especificação do agente Rafael) estiverem disponíveis.
# ---------------------------------------------------------------------
app.importacao.estabelecimentos.enabled=false
app.importacao.estabelecimentos.caminho-arquivo=D:/saude-monitor/multiplas_camadas_saude_14/estabelecimentos.csv
app.importacao.estabelecimentos.formato=CSV
app.importacao.estabelecimentos.raio-geofence-metros=100.0
app.importacao.estabelecimentos.uf-padrao=DF

# ---------------------------------------------------------------------
# Seed de estabelecimentos a partir de DBF (atributos) + SHP (geometria)
# Roda no startup (ApplicationRunner) quando app.seed.enabled=true.
# Idempotente:
#   modo=skip-if-not-empty (padrão) → só semeia se a coleção hospitais estiver VAZIA;
#   modo=upsert                   → re-importa fazendo upsert por codigoCnes/importKey.
# As coordenadas (lat/lon) vêm do .shp; o .dbf carrega apenas os atributos.
# ---------------------------------------------------------------------
app.seed.enabled=true
app.seed.path=data/
app.seed.codepage=UTF-8
app.seed.modo=skip-if-not-empty
app.seed.lote=DBF_SHP_SEED
app.seed.tolerancia-bbox=0.05
# Raio do geofence circular por categoria (metros).
#
# BUG-08 (06/09/2026): os valores anteriores (HOSPITAL 200 · UBS 100 · demais 150)
# cobriam a vizinhança do estabelecimento, não o estabelecimento. Medição que
# motivou a redução: Cepav - Amarílis e a Unidade de Vigilância Ambiental do
# Recanto das Emas estão a 193 m um do outro e, com 150 m cada, seus geofences se
# sobrepunham — quem estivesse na rua entre os dois entrava nos dois. Isso
# contradiz a RN-01, que existe para "evitar 'atravessou a rua'".
#
# Estes valores são a fonte da verdade do raio: o reconciliador
# (ReconciliacaoRaioGeofenceRunner) regrava no startup os geofences do banco que
# ainda estiverem no raio antigo. Mudar um número aqui muda o banco no próximo
# deploy — não é só configuração de importação.
app.seed.raio-hospital=150.0
app.seed.raio-upa=100.0
app.seed.raio-ubs=75.0
app.seed.raio-policlinica=100.0
app.seed.raio-caps=100.0
app.seed.raio-centro-especializado=100.0
app.seed.raio-outro=100.0
# Reconciliação do raio dos geofences já gravados (BUG-08). Idempotente: só toca
# círculos gerados pelo produto que estejam fora do raio da categoria.
app.geofence.reconciliacao.enabled=true

# ---------------------------------------------------------------------
# Segurança / JWT (F0-01)
# Access token: 15 min · Refresh token: 30 dias (rotação no refresh)
# IMPORTANTE (produção): sobrescrever JWT_SECRET via variável de ambiente com
# chave >= 32 bytes (HS256). O valor abaixo é apenas para desenvolvimento local.
# ---------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:saude-monitor-dev-secret-key-2026-change-me-32bytes-min}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000

# ---------------------------------------------------------------------
# Seed de usuário ADMIN inicial (primeiro boot) — idempotente.
# Cria um usuário ADMIN padrão se ainda não existir nenhum na base.
# IMPORTANTE (produção): sobrescrever a senha via variável de ambiente.
# ---------------------------------------------------------------------
app.seed-admin.enabled=true
app.seed-admin.email=${ADMIN_EMAIL:admin@saude.com}
app.seed-admin.senha=${ADMIN_SENHA:admin123}
app.seed-admin.nome=Administrador

# ---------------------------------------------------------------------
# Resend (envio do código de redefinição de senha — "esqueci minha senha")
# IMPORTANTE (produção): RESEND_API_KEY é obrigatório para o envio funcionar; sem
# domínio verificado no Resend, o remetente padrão (sandbox) só entrega para o
# e-mail da própria conta Resend, não para usuários reais.
# ---------------------------------------------------------------------
app.resend.api-key=${RESEND_API_KEY:}
app.resend.remetente=${RESEND_FROM_EMAIL:Saúde Monitor <onboarding@resend.dev>}

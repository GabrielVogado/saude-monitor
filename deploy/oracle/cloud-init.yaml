#cloud-config
# Provisionamento da VM Ampere A1 (Ubuntu 24.04 aarch64) que hospeda o backend.
# Cole este conteúdo em "Show advanced options > Management > User data" ao criar
# a instância na OCI. Ele instala o Docker e — ponto crítico — abre 80/443 no
# iptables local. A Security List da VCN sozinha NÃO basta: a imagem Ubuntu da
# Oracle sobe com regras de INPUT que descartam tudo além do 22, e o sintoma de
# esquecer isso é timeout silencioso, sem log em lugar nenhum.
package_update: true
packages:
  - ca-certificates
  - curl
  - git
runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT
  - netfilter-persistent save
  - mkdir -p /opt/saude-monitor && chown ubuntu:ubuntu /opt/saude-monitor

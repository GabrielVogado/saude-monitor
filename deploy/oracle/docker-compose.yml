# Stack do backend na VM Ampere A1 (Oracle Cloud Always Free, São Paulo).
# Substitui o Render, cujo plano free fazia spin-down após ~15 min de ociosidade
# (109 s e HTTP 503 na primeira abertura, medidos em 02/09/2026) e dividia uma
# fração de vCPU. Aqui a instância fica ligada 24/7 e o OCPU é um core dedicado.
#
# Uso na VM (em /opt/saude-monitor):
#   docker compose pull && docker compose up -d
services:
  backend:
    image: ghcr.io/gabrielvogado/saude-monitor-backend:${TAG_IMAGEM:-dev-arm64}
    container_name: saude-monitor-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Sem limite explícito a JVM reserva 1/4 da RAM da máquina inteira. Com o
      # teto de memória abaixo, ela passa a se dimensionar pelo cgroup.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    expose:
      - "8080"
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: saude-monitor-caddy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
      EMAIL_TLS: ${EMAIL_TLS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:

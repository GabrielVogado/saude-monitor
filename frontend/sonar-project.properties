# SonarQube Cloud: app mobile (Expo / React Native). Análise disparada pelo ci.yml.
# Organização e chave precisam ser exatamente as criadas no SonarQube Cloud
# (passo a passo em Documentos/10-git-flow/MANUAL.md §4.4).
sonar.organization=gabrielvogado
sonar.projectKey=gabrielvogado_saude-monitor-mobile
sonar.projectName=Radar Saúde - Mobile

sonar.sources=src,App.js
sonar.tests=src
sonar.test.inclusions=src/**/__tests__/**
sonar.exclusions=src/**/__tests__/**

# Mesmo recorte do collectCoverageFrom do jest.config.js: estilo e tema não têm
# teste a cobrar.
sonar.coverage.exclusions=src/**/css/**,src/theme/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
